name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options: [Debug, Release]
        default: Debug
      flavor:
        description: 'SDK flavor (minSdk: latest=33/Android13, marshmallow=23, lollipop=21, legacy=16; qrs/tens are rejected by app/jni/CMakeLists.txt)'
        type: choice
        options: [marshmallow, latest, lollipop, legacy]
        default: marshmallow
      abi:
        description: 'ABI flavor (both = arm64-v8a + armeabi-v7a, one APK each)'
        type: choice
        options: [both, arm64, arm32, universal, x64, x86]
        default: both
      free_disk_space:
        description: 'Remove preinstalled toolchains before building (recommended)'
        type: boolean
        default: true
      save_generated_keystore:
        description: 'Upload auto-generated keystore as artifact (needed to re-sign updates later)'
        type: boolean
        default: false
      publish_release:
        description: 'Publish the built APKs to a GitHub release (the in-app "check for updates" reads it)'
        type: boolean
        default: true
  push:
    # NOTE: release tags created by this workflow are `v<versionCode>-<runNumber>`
    # and must NOT match this filter, otherwise publishing would re-trigger a build.
    tags:
      - 'build-*'

concurrency:
  group: tgx-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  FLAVOR: ${{ inputs.flavor || 'marshmallow' }}
  BUILD_TYPE: ${{ inputs.build_type || 'Debug' }}
  HAS_KEYSTORE_SECRET: ${{ secrets.KEYSTORE_BASE64 != '' }}

jobs:
  build:
    name: ${{ inputs.flavor || 'marshmallow' }} / ${{ matrix.abi }} / ${{ inputs.build_type || 'Debug' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # `both` fans out into two parallel jobs: arm64-v8a + armeabi-v7a
      matrix:
        abi: ${{ fromJSON(inputs.abi == 'both' && '["arm64","arm32"]' || format('["{0}"]', inputs.abi || 'arm64')) }}
    env:
      ABI: ${{ matrix.abi }}

    steps:
      - name: Free disk space
        if: ${{ inputs.free_disk_space != false }}
        run: |
          df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/julia* \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/lib/llvm-* \
            /opt/microsoft \
            /opt/pipx
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          docker image prune --all --force 2>/dev/null || true
          echo "Disk space after cleanup:"
          df -h / | tail -1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Fetch submodules
        run: |
          set -e
          git config --global --add safe.directory '*'
          echo "::group::git submodule update (shallow)"
          if ! git submodule update --init --recursive --depth 1 --jobs 4; then
            echo "Shallow fetch failed, retrying with full history..."
            git submodule update --init --recursive --jobs 4
          fi
          echo "::endgroup::"
          echo "::group::git lfs"
          git lfs install || true
          git lfs pull || true
          git submodule foreach --recursive 'git lfs install --local || true; git lfs pull || true'
          echo "::endgroup::"
          du -sh .git tdlib 2>/dev/null || true
          df -h / | tail -1

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -e
          prop() { grep -m1 "^$1=" version.properties | cut -d= -f2- | tr -d '\r'; }
          CMDLINE_VERSION=$(prop version.cmdline_tools)
          SDK_PACKAGE=$(prop version.sdk_package)
          BUILD_TOOLS=$(prop version.build_tools)
          NDK_PRIMARY=$(prop version.ndk_primary)
          NDK_LEGACY=$(prop version.ndk_legacy)
          CMAKE_VERSION=$(prop version.cmake)

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
            URL="https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"
            curl -fsSL -o /tmp/cmdline-tools.zip "$URL" \
              || curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses --sdk_root="$ANDROID_SDK_ROOT" > /dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platforms;$SDK_PACKAGE" \
            "build-tools;$BUILD_TOOLS" \
            "ndk;$NDK_PRIMARY" \
            "cmake;$CMAKE_VERSION"
          if [ "$FLAVOR" = "legacy" ]; then
            "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --install "ndk;$NDK_LEGACY"
          fi
          echo "Android SDK installed at $ANDROID_SDK_ROOT"

      - name: Tune Gradle memory for runner (16 GB RAM)
        run: |
          set -e
          mkdir -p "$HOME/.gradle"
          # Appended keys win over the ones declared in the project's gradle.properties
          # (project defaults are -Xmx8G for both daemons, runner only has 16 GB)
          cat <<'PROPS' | sed 's/^[[:space:]]*//' >> gradle.properties

          # --- CI overrides ---
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
          kotlin.daemon.jvm.options=-Xmx2g
          org.gradle.workers.max=4
          PROPS
          tail -5 gradle.properties

      - name: Create local.properties
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          APP_ID: ${{ vars.APP_ID }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          set -e
          cat <<EOF | sed 's/^[[:space:]]*//' > local.properties
          sdk.dir=$ANDROID_SDK_ROOT
          app.id=${APP_ID:-org.example.tgx}
          app.name=${APP_NAME:-Lite X}
          app.download_url=${{ github.server_url }}/${{ github.repository }}/releases/latest
          app.sources_url=${{ github.server_url }}/${{ github.repository }}
          telegram.api_id=${TELEGRAM_API_ID:-94575}
          telegram.api_hash=${TELEGRAM_API_HASH:-a3406de8d171bb422bb6ddf3bbd800e2}
          keystore.file=keystore.properties
          tgx.extension=none
          EOF
          echo "--- local.properties ---"
          sed 's/^\(telegram.api_id=\).*/\1***/; s/^\(telegram.api_hash=\).*/\1***/' local.properties

      - name: Validate flavor against native whitelist
        # app/jni/CMakeLists.txt only accepts a subset of the Gradle flavors;
        # fail in 5 seconds instead of ~1 hour into configureCMake.
        run: |
          set -e
          PATTERN=$(grep -m1 -o 'MATCHES "[^"]*"' app/jni/CMakeLists.txt | sed 's/.*MATCHES "//; s/"$//')
          echo "native whitelist: $PATTERN"
          if [ -z "$PATTERN" ]; then
            echo "::warning::could not read whitelist from app/jni/CMakeLists.txt, skipping check"
            exit 0
          fi
          if echo "$FLAVOR" | grep -Eq "$PATTERN"; then
            echo "flavor '$FLAVOR' is accepted by the native build"
          else
            echo "::error::flavor '$FLAVOR' is rejected by app/jni/CMakeLists.txt ($PATTERN) - pick a different flavor"
            exit 1
          fi

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          KEYSTORE_PATH="$HOME/tgx-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from secrets.KEYSTORE_BASE64"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            STORE_PASS="${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is required when KEYSTORE_BASE64 is set}"
            ALIAS="${KEY_ALIAS:?KEY_ALIAS secret is required when KEYSTORE_BASE64 is set}"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "No keystore secret found - generating a throwaway one"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias tgx \
              -storepass tgxandroid -keypass tgxandroid \
              -dname "CN=Telegram X CI, OU=CI, O=TGX, L=Unknown, ST=Unknown, C=US"
            STORE_PASS="tgxandroid"
            ALIAS="tgx"
            KEY_PASS="tgxandroid"
          fi
          cat <<EOF | sed 's/^[[:space:]]*//' > keystore.properties
          keystore.file=$KEYSTORE_PATH
          keystore.password=$STORE_PASS
          key.alias=$ALIAS
          key.password=$KEY_PASS
          EOF
          echo "Keystore ready: $KEYSTORE_PATH"

      - name: Build APK
        run: |
          set -e
          chmod +x gradlew
          FLAVOR_CAP="$(echo "${FLAVOR:0:1}" | tr 'a-z' 'A-Z')${FLAVOR:1}"
          ABI_CAP="$(echo "${ABI:0:1}" | tr 'a-z' 'A-Z')${ABI:1}"
          TASK="assemble${FLAVOR_CAP}${ABI_CAP}${BUILD_TYPE}"
          echo "Gradle task: $TASK"
          EXTRA_ARGS=""
          if [ "$FLAVOR" = "legacy" ]; then
            EXTRA_ARGS="-PuseLegacyNdk=true"
          fi
          # baked into BuildConfig.CI_BUILD_NUMBER so that two builds of the same
          # app version can be told apart by the in-app updater
          ./gradlew $TASK $EXTRA_ARGS -PciBuildNumber="${GITHUB_RUN_NUMBER:-0}" --stacktrace

      - name: Collect APK
        id: collect
        run: |
          set -e
          mkdir -p apk-out
          find app/build/outputs/apk -name '*.apk' -exec cp {} apk-out/ \;
          ls -lh apk-out
          cd apk-out && sha256sum *.apk | tee ../apk-out/SHA256.txt

      - name: Inspect APK metadata
        id: badging
        run: |
          set -e
          prop() { grep -m1 "^$1=" version.properties | cut -d= -f2- | tr -d '\r'; }
          AAPT="$ANDROID_SDK_ROOT/build-tools/$(prop version.build_tools)/aapt2"
          echo "## APK metadata" >> "$GITHUB_STEP_SUMMARY"
          for apk in apk-out/*.apk; do
            echo "::group::$(basename "$apk")"
            "$AAPT" dump badging "$apk" > /tmp/badging.txt
            grep -E "^package:|sdkVersion:|targetSdkVersion:|native-code:|application-label:" /tmp/badging.txt || true
            echo "::endgroup::"
            {
              echo ""
              echo "### $(basename "$apk")"
              echo '```'
              grep -E "^package:|sdkVersion:|targetSdkVersion:|native-code:|application-label:" /tmp/badging.txt || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          # consumed by the "Publish GitHub release" job and by the in-app updater
          # (one file per ABI, the release job prefers arm64)
          grep -m1 -o "versionCode='[0-9]*'" /tmp/badging.txt | tr -dc '0-9' > "apk-out/version-code-${ABI}.txt"
          grep -m1 -o "versionName='[^']*'" /tmp/badging.txt | sed "s/versionName='//; s/'$//" > "apk-out/version-name-${ABI}.txt"
          echo "versionCode=$(cat "apk-out/version-code-${ABI}.txt"), versionName=$(cat "apk-out/version-name-${ABI}.txt")"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgx-${{ env.FLAVOR }}-${{ env.ABI }}-${{ env.BUILD_TYPE }}
          path: |
            apk-out/*.apk
            apk-out/version-code-*.txt
            apk-out/version-name-*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated keystore
        # `secrets` is not available in `if:` expressions, only via env
        if: ${{ inputs.save_generated_keystore == true && env.HAS_KEYSTORE_SECRET == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: tgx-ci-keystore
          path: keystore.properties
          retention-days: 90

  release:
    name: Publish GitHub release
    # the in-app "check for updates" reads /releases/latest of this repository
    if: ${{ inputs.publish_release != false }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: tgx-*
          merge-multiple: true
          path: apk-out

      - name: Compose release metadata
        id: meta
        run: |
          set -e
          cd apk-out
          # arm64 is the reference build, fall back to whatever ABI was built
          VERSION_CODE=$(cat version-code-arm64.txt 2>/dev/null || cat version-code-*.txt | head -1)
          VERSION_NAME=$(cat version-name-arm64.txt 2>/dev/null || cat version-name-*.txt | head -1)
          BUILD_NUMBER="${GITHUB_RUN_NUMBER:-0}"
          rm -f version-code-*.txt version-name-*.txt
          sha256sum *.apk > SHA256.txt
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_CODE}-${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME} (build ${BUILD_NUMBER})" >> "$GITHUB_OUTPUT"
          ls -lh
          {
            echo "## Lite X ${VERSION_NAME}"
            echo ""
            echo "| | |"
            echo "|-|-|"
            echo "| versionCode | ${VERSION_CODE} |"
            echo "| versionName | ${VERSION_NAME} |"
            echo "| CI build | ${BUILD_NUMBER} |"
            echo "| flavor / build type | ${{ env.FLAVOR }} / ${{ env.BUILD_TYPE }} |"
            echo "| APK | $(ls *.apk | tr '\n' ' ') |"
            echo "| commit | ${{ github.sha }} |"
            echo ""
            echo "### 校验值"
            echo '```'
            cat SHA256.txt
            echo '```'
            echo ""
            echo "> arm64-v8a 适用于绝大多数现代设备；armeabi-v7a 供 32 位设备使用。两个 ABI 包名相同，不能同时安装。"
          } > ../release-notes.md
          cat ../release-notes.md

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release-notes.md
          make_latest: true
          draft: false
          files: |
            apk-out/*.apk
            apk-out/SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
