// Cloudflare Worker configuration for the Lite-X relay.
// Deploy:  npx wrangler deploy
// Secrets: npx wrangler secret put BOT_TOKEN
//          npx wrangler secret put RELAY_SECRET   (optional)

name = "lite-x-relay"
main = "worker.js"
compatibility_date = "2024-11-01"

# Free plan is enough: the relay only issues JSON calls to api.telegram.org.
# Add the variables below in the dashboard (Settings -> Variables) or with
# `wrangler secret put`, never commit real values to the repository.
#
# [vars]
# RELAY_SECRET = "change-me"
# WEBHOOK_PATH = "webhook"
